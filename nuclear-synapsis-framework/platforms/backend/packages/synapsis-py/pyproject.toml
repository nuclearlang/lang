[project]
name = "synapsis-py"
version = "0.83.2"
license = "Apache-2.0"
description = "Synapsis for Python: the runtime of the fastapi dialect of NuclearLang (FastAPI, SQLAlchemy 2, LangChain, LangGraph)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  # serialize_by_alias: a model's JSON has Nuclear's names (synapsis.models)
  "pydantic>=2.11",
  "sqlalchemy[asyncio]>=2.0.36",
  # the migrations of the database schema (nuclear migrate, ADR-backend-0001)
  "alembic>=1.14",
  # HTTP repositories (ADR-codegen-0001): a backend that calls another API
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://nuclearlang.github.io"
Repository = "https://github.com/nuclearlang/lang"

[project.optional-dependencies]
# core: no driver (the generated pyproject.toml lists the used extras before it)
core = []
ai = ["langchain>=1.0", "langchain-core>=1.0", "langgraph>=1.0"]
postgres = ["asyncpg>=0.30"]
mysql = ["aiomysql>=0.2"]
sqlite = ["aiosqlite>=0.20"]
redis = ["redis>=5.2"]
kafka = ["aiokafka>=0.12"]
openai = ["langchain-openai>=0.3"]
ollama = ["langchain-ollama>=0.3"]
chroma = ["langchain-chroma>=0.2", "chromadb>=0.6"]
# spec 012 (proof of concept): traces and metrics over OTLP to Datadog, New Relic, Grafana or a collector
telemetry = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27", "opentelemetry-instrumentation-fastapi>=0.48b0"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "aiosqlite>=0.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
