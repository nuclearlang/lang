name: Bug
description: Something does not work as the documents say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest .nuc file or the commands, and their output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`nuclear --help` header or the extension's version; every part carries one version"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [language / compiler, a dialect (generated code), Synapsis (mobile), Synapsis (backend), Synapsis (web), the nuclear command, an editor extension, the installer, the MCP server, the Smart Graph, the local agents, the website]
  - type: input
    id: system
    attributes:
      label: System
      placeholder: macOS 15 arm64, Ubuntu 24.04, Windows 11...
