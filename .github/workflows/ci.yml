# Every Rust crate of the tree (the compiler, the language server, the command line tools) against every dialect and
# platform example, and the equivalences of the language dialects' references.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "One version for every project (ADR-platform-0011)"
        run: installer/release/version.sh --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: "Tests and clippy"
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
      - name: "The references' equivalences"
        working-directory: nuclearlang
        run: |
          for l in typescript dart python; do
            python3 tools/spec-check/check.py dialects/$l/docs/07-reference/$l.md $l $l
          done
