# The Zed extension: compiled to wasm32-wasip2.
name: extension-zed

on:
  push:
    branches: [main]
    paths: ['extensions/zed/**', '.github/workflows/extension-zed.yml']
  pull_request:
    paths: ['extensions/zed/**', '.github/workflows/extension-zed.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: "Build"
        working-directory: extensions/zed
        run: cargo build --release --target wasm32-wasip2
