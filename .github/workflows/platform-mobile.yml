# The mobile platform: the flutter dialect against the examples, the Dart runtimes, an app built and tested.
name: platform-mobile

on:
  push:
    branches: [main]
    paths: ['nuclearlang/**', 'tools/cli/**', 'Cargo.toml', 'Cargo.lock', 'nuclear-synapsis-framework/**', 'installer/**', '.github/workflows/platform-mobile.yml']
  pull_request:
    paths: ['nuclearlang/**', 'tools/cli/**', 'Cargo.toml', 'Cargo.lock', 'nuclear-synapsis-framework/**', 'installer/**', '.github/workflows/platform-mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: "The reference's examples"
        run: |
          python3 nuclear-synapsis-framework/platforms/mobile/checks/spec-check-dragonfly.py
          cd nuclearlang && python3 tools/spec-check/check.py dialects/dart/docs/07-reference/flutter.md flutter dart
      - name: "The Dart runtimes"
        working-directory: nuclear-synapsis-framework/platforms/mobile/packages/dragonfly
        run: flutter pub get && flutter test && flutter analyze
      - name: Install nuclear and dragonfly
        run: |
          installer/release/build-runtimes.sh && installer/install.sh --no-vscode --no-zed --no-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "The backend whose contract the app reads"
        run: nuclear build nuclear-synapsis-framework/platforms/backend/examples/examples-backend/tasks_api
      - name: "An app built and tested"
        working-directory: nuclear-synapsis-framework/platforms/mobile/examples/examples-flutter-dialect/tasks_app
        run: |
          dragonfly build
          dragonfly test
