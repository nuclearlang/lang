# The public Windows installer (installer/release/install.ps1) on a real Windows: Windows PowerShell 5.1 and 7 on x64,
# 5.1 on arm64, each with the required Smart Graph and MCP server (profile `remote`: the graph's own model, no
# Ollama); then a second run (kept), -Reinstall while the services run, and the uninstall, which must leave nothing. It runs after every release (`workflow_run`: a release made by
# the release workflow's token triggers no `release` event) and by hand:
#   gh workflow run installer-windows -R nuclearlang/nuclearlang [-f version=0.1.5]
name: installer-windows

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "the release to install (0.1.5); empty: the latest"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, shell: powershell, ai: remote }
          - { runner: windows-latest, shell: pwsh, ai: remote }
          # Windows on ARM runs the x64 AI archive under its x64 emulation (no onnxruntime wheel for ARM64)
          - { runner: windows-11-arm, shell: powershell, ai: remote }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WANTED: ${{ inputs.version || github.event.workflow_run.head_branch }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      # the installer itself runs in the PowerShell of the case: Windows PowerShell 5.1 (`powershell`) or 7 (`pwsh`)
      - name: Install
        run: |
          $v = "$env:WANTED".TrimStart('v'); if (-not $v) { $v = 'latest' }
          $options = @('-Version', $v, '-NoVSCode')
          if ('${{ matrix.ai }}') { $options += @('-AiProfile', '${{ matrix.ai }}') } else { $options += '-NoAi' }
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./installer/release/install.ps1 @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "nuclear runs"
        run: |
          $nuclear = Join-Path $env:LOCALAPPDATA 'nuclearlang\bin\nuclear.exe'
          & $nuclear dialect list
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: "The AI services: the Smart Graph runs"
        if: matrix.ai != ''
        run: |
          $builder = Join-Path $env:LOCALAPPDATA 'nuclearlang\ai\bin\nuclear-builder.cmd'
          $status = & $builder setup --status --json | Out-String | ConvertFrom-Json
          $status | ConvertTo-Json -Depth 4
          if (-not $status.graph) { Write-Error 'the Smart Graph does not answer'; exit 1 }
      # run again: what is there is kept (nothing downloaded); then -Reinstall replaces it while the services run
      - name: Run again, then reinstall
        run: |
          $v = "$env:WANTED".TrimStart('v'); if (-not $v) { $v = 'latest' }
          $options = @('-Version', $v, '-NoVSCode')
          if ('${{ matrix.ai }}') { $options += @('-AiProfile', '${{ matrix.ai }}') } else { $options += '-NoAi' }
          $again = & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./installer/release/install.ps1 @options *>&1 | Out-String
          Write-Output $again
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($v -ne 'latest' -and $again -notmatch 'already installed') { Write-Error 'a second run of the same version did not keep the installation'; exit 1 }
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./installer/release/install.ps1 @options -Reinstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:LOCALAPPDATA 'nuclearlang\bin\nuclear.exe') dialect list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ('${{ matrix.ai }}') {
            $status = & (Join-Path $env:LOCALAPPDATA 'nuclearlang\ai\bin\nuclear-builder.cmd') setup --status --json | Out-String | ConvertFrom-Json
            if (-not $status.graph) { Write-Error 'the Smart Graph does not answer after -Reinstall'; exit 1 }
          }
      - name: Uninstall
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./installer/release/install.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $left = @((Join-Path $env:LOCALAPPDATA 'nuclearlang'), (Join-Path $env:APPDATA 'nuclearlang')) | Where-Object { Test-Path $_ }
          if ($left) { Write-Error "left behind: $($left -join ', ')"; exit 1 }
