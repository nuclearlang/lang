# The release of NuclearLang: on a tag v<version> (the version of Cargo.toml [workspace.package]) every target's archive
# is built (installer/release/package.sh), with the AI services' archive of each system (ai-runtime.sh) and the VS Code extension, and published in the GitHub release that the
# installers download from (installer/release/install.sh, install.ps1; also served by the website).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: The JavaScript runtimes (their dist/)
        run: installer/release/build-runtimes.sh
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - name: musl (static Linux binaries, any distribution)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Archive
        run: installer/release/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            installer/dist/*.tar.gz
            installer/dist/*.zip
            installer/dist/*.sha256

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - name: "Nuclear Chat's UI, embedded (the extension carries it)"
        run: |
          (cd nuclearlang/tools/node && npm ci --no-audit --no-fund)
          installer/release/build-runtimes.sh
          nuclear-chat/ui/build-embed.sh
      - name: The extension (its bundled server is the Linux one; the installers link the platform's own nuclear-lsp)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cd extensions/vscode && npm ci --no-audit --no-fund && npm run package
          mkdir -p ../../dist && cp nuclearlang-*.vsix "../../dist/nuclearlang-$version.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: dist/*.vsix

  # the AI services' archive (ADR-installer-0003): a Python of their own with the Smart Graph, the MCP server and the
  # Nuclear Developer, built and tried on a runner of each system (glibc Linux: onnxruntime has no musl wheel)
  ai:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest }
          - { runner: ubuntu-24.04-arm }
          # no macos-15-intel: onnxruntime (chromadb's) publishes no wheel for an Intel Mac; the installer says so there
          - { runner: macos-15 }
          - { runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: The JavaScript runtimes (stage.sh copies their dist/)
        run: installer/release/build-runtimes.sh
      - name: nuclear, to build the services from their .nuc
        run: |
          cargo build --release --quiet -p nuclear-cli
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          installer/release/stage.sh "$RUNNER_TEMP/nuclearlang" "target/release/nuclear$exe"
          echo "NUCLEAR=$RUNNER_TEMP/nuclearlang/bin/nuclear$exe" >> "$GITHUB_ENV"
      - name: The AI archive, built and tried
        run: installer/release/ai-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ai-${{ matrix.runner }}
          path: |
            installer/dist/nuclearlang-ai-*.tar.gz
            installer/dist/nuclearlang-ai-*.zip
            installer/dist/nuclearlang-ai-*.sha256

  # The vectors of the knowledge base, once for every system (ADR-graph-0003): a vector depends only on the text and
  # the model, so one file serves Linux, macOS and Windows; the set-up downloads it and the graph loads the base in
  # seconds instead of running its model over every row.
  embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
      - name: nuclear, to build the graph from its .nuc
        run: cargo build --release --quiet -p nuclear-cli
      # the latest published release is the previous one (this one publishes at the end): its vectors serve every text
      # that did not change, so a release of code or UI computes none and takes seconds
      - name: The previous release's vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'nuclearlang-embeddings-*.npz' --dir "$RUNNER_TEMP/previous" \
            || echo "no previous vectors: every one is computed"
      - name: The vectors of the knowledge base
        working-directory: nuclear-graph-storage
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -n 1)
          ../target/release/nuclear build .
          uv sync --quiet --extra server
          mkdir -p ../installer/dist
          NUCLEAR_GRAPH_HOME="$RUNNER_TEMP/graph" NUCLEAR_GRAPH_NO_KEYRING=1 NUCLEAR_ROOT="$GITHUB_WORKSPACE" HF_HUB_VERBOSITY=error \
            .venv/bin/python -c 'import sys; from nuclear_graph.cli import main; main(sys.argv[1:])' embeddings "../installer/dist/nuclearlang-embeddings-$v.npz" \
            --reuse "$(ls "$RUNNER_TEMP"/previous/*.npz 2>/dev/null | head -n 1)"
          cd ../installer/dist && sha256sum "nuclearlang-embeddings-$v.npz" > "nuclearlang-embeddings-$v.npz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: embeddings
          path: installer/dist/nuclearlang-embeddings-*

  publish:
    needs: [archive, ai, vscode, embeddings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The installers, also as assets of the release
        run: cp installer/release/install.sh installer/release/install.ps1 dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
