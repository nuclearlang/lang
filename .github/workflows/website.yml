# The website: its content from the reference and the guides of every project, the app built and tested, the bundle.
# A push to main then asks nuclearlang.github.io (GitHub serves the site only from that repository) to publish it: a
# `repository_dispatch` of type `website`, with the secret SITE_DISPATCH_TOKEN (skipped while it is not set).
name: website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The mobile onboarding is replayed (`nuclear new -p mobile` needs Flutter): the version of platform-mobile.yml.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Install nuclear
        run: |
          installer/release/build-runtimes.sh && installer/install.sh --no-vscode --no-zed --no-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "Content, build, tests, bundle"
        working-directory: website
        run: |
          (cd tools && npm ci --no-audit --no-fund)
          node tools/content.mjs
          nuclear build
          nuclear install
          nuclear test
          (cd build/app && npx vite build)
      - name: "Publish: nuclearlang.github.io builds the site from main"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SITE_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api repos/nuclearlang/nuclearlang.github.io/dispatches -f event_type=website
