pages = ["extensions/tools/nuclear-builder/docs/08-guides/README", "extensions/tools/nuclear-builder/docs/08-guides/write-a-spec", "extensions/tools/nuclear-builder/docs/08-guides/follow-a-run", "extensions/tools/nuclear-builder/docs/08-guides/pipeline-commands"]

[[tools]]
key = "connector"
