pages = ["extensions/tools/nuclear-connector/docs/08-guides/README"]

[[tools]]
key = "devices"
name = "Devices"
group = "Run"
tagline = "Phones and tablets in a window, without an emulator."
pitch = "nuclear device shows a mobile app in a window shaped like a phone (pixel7, iphone14pro, ipadair...), with hot reload; several at once. nuclear terminal-device draws the app inside the terminal. In VS Code the device manager keeps them next to the code."
