# The site's data: what tools/content.mjs turns into public/content/*.json and the app shows. The pages themselves
# are the .md of the projects of the tree (their docs/07-reference and docs/08-guides); nothing of the site is
# written in its code. Every number the site shows is measured when it is built (the onboarding runs the real
# commands), never written here.

[site]
title = "NuclearLang"
lead = "Write only the logic."
tagline = "A minimal language for AI agents and people. One codebase, transpiled to TypeScript, Dart and Python by declarative dialects; Synapsis, its framework, builds mobile apps, backends and web apps from the same Nuclear."
# where the site is published, the organization of its repositories and their branch
url = "https://nuclearlang.github.io"
org = "https://github.com/nuclearlang"
branch = "main"
footer = "NuclearLang and Synapsis · free and open source, Apache-2.0 · this site is written in Nuclear (Synapsis web)"

[source]
# the NuclearLang tree this project is a folder of; NUCLEAR_TREE overrides it
tree = ".."

# the links of the top bar (a path in the tree is a page; another path is a screen of the app)
[[top]]
title = "Platforms"
path = "/platforms/mobile"

[[top]]
title = "Tools"
path = "/tools"

[[top]]
title = "Guide"
path = "/nuclearlang/docs/08-guides/README"

[[top]]
title = "Reference"
path = "/nuclearlang/docs/08-guides/reference"

# the side menu of the documentation: pages by their path in the tree, without .md; `*` matches any part of a name,
# in order (a pattern leaves out the READMEs: list them by name)
[[sidebar]]
title = "Start"
pages = ["nuclear-synapsis-framework/docs/08-guides/README", "nuclear-synapsis-framework/docs/08-guides/tutorial", "nuclear-synapsis-framework/platforms/*/docs/08-guides/onboarding-*"]

[[sidebar]]
title = "Language guide"
pages = ["nuclearlang/docs/08-guides/README", "nuclearlang/docs/08-guides/[0-9][0-9]-*"]

[[sidebar]]
title = "Reference"
pages = ["nuclearlang/docs/08-guides/reference", "nuclearlang/docs/07-reference/nuclear-base", "nuclearlang/docs/07-reference/library", "nuclearlang/docs/07-reference/grammar", "nuclearlang/docs/07-reference/reserved-words", "nuclearlang/docs/07-reference/diagnostics", "nuclearlang/docs/07-reference/decisions"]

