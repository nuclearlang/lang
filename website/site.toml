# The site's data: what tools/content.mjs turns into public/content/site.json and home.json, and the app shows. The
# pages themselves are the .md of the nuclearlang repositories; nothing of the site is written in its code.

[site]
title = "NuclearLang"
lead = "Only the program's logic."
tagline = "A minimal language, made so agents and people write it fast, transpiled to TypeScript, Dart and Python through declarative dialects. Synapsis is its framework for mobile, backend and web."
# where the site is published, the organization of its repositories and their branch
url = "https://nuclearlang.github.io"
org = "https://github.com/nuclearlang"
branch = "main"
footer = "NuclearLang and Synapsis · Apache-2.0 · this site is written in Nuclear (Synapsis web, react)"

[source]
# the NuclearLang tree this project is a folder of; NUCLEAR_TREE overrides it
tree = ".."

# the links of the top bar
[[top]]
title = "Guide"
