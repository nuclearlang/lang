# --- the home page: the hooks, from the most general to the most concrete; each one links to where it is explained ---

[[home.actions]]
title = "Start with a platform"
path = "/start/backend"
primary = true

[[home.actions]]
title = "See the tools"
path = "/tools"

[[home.actions]]
title = "Language guide"
path = "/nuclearlang/docs/08-guides/README"

# why Nuclear, in one line each
[[home.hooks]]
title = "Only the logic"
text = "No semicolons, braces, new or async, and no mandatory return. Imports, wiring, JSON, routes and dependency injection are written by the transpiler."

[[home.hooks]]
title = "Made for agents"
text = "One way to write each thing, so an agent never hesitates. Every error comes as JSON with a code, a position and the exact fix."

[[home.hooks]]
title = "As fast as an expert's code"
text = "The output passes tsc --strict, flutter analyze and pyright --strict. Measured against hand-written programs: between 0.98× and 1.11× their run time."

[[home.hooks]]
title = "Tools write the standard code"
text = "One command writes a whole resource: models, repository, use cases, the controller or the screen, and its tests, compiling."

[[home.hooks]]
title = "One codebase, any dialect"
text = "The Nuclear of a backend is the same for FastAPI and for NestJS. Change one word of config.nuc, build again."

[[home.hooks]]
title = "Free, open and local"
text = "Apache-2.0. The knowledge base and the small agents run on your machine; your code never has to leave it."

# the samples of the first interactive block: the same Nuclear, built by the real compiler to each target
[home.samples]
title = "Write it once. Read it in TypeScript, Dart and Python."
note = "Every output is made by the real compiler when the site is built."
targets = ["typescript", "dart", "python"]

[[home.samples.items]]
title = "Models and functions"
code = '''
Role
  user
  admin("administrator")

User(name: string, role: Role = Role.user)
  visits: int = 0

  isAdmin() boolean
    role == Role.admin

greet(user: User) string
  title = if user.isAdmin()
    'Admin'
  else
    'User'
  '${title} ${user.name}'
'''

[[home.samples.items]]
title = "Errors as values"
code = '''
ParseError(message: string)

parseAge(text: string) Result<ParseError, int>
  age = int.tryParse(text)
  if age == null
    Err(ParseError(message = "not a number: ${text}"))
  else if age < 0
    Err(ParseError(message = "an age is never negative"))
  else
    Ok(age)

describe(text: string) string
  match parseAge(text)
    Ok(age) -> "${age} years"
    Err(e) -> "invalid: ${e.message}"
'''

[[home.samples.items]]
title = "Async without async"
code = '''
Weather(city: string, celsius: double)

WeatherApi()
  current(city: string) Weather
    Weather(city = city, celsius = 21.5)

report(api: WeatherApi, cities: string[]) string[]
  lines: string[] = []
  for city in cities
    w = ~api.current(city)
    lines.add("${w.city}: ${w.celsius}°C")
  lines
'''

# the second block: an agent's mistake, what the compiler answers, and the fix it applies (`nuclear check`, `nuclear fix`)
[home.check]
title = "Errors an agent can fix by itself"
text = "An agent used to TypeScript writes its habits. The compiler answers with the code, the position and the exact fix; nuclear fix applies it."
dialect = "typescript"
code = '''
Cart()
  items: double[] = []

  total() double
    let sum = 0.0
    for price in items
      if price > 0 && price < 1000
        sum = sum + price
    sum
'''

# the third block: the onboarding of one platform, replayed (its real commands and output)
[home.generator]
title = "One command writes the feature"
text = "The commands that made the example API, run again while the site was built. Every file they wrote compiles and is tested."
platform = "backend"

# the fourth block: the same Nuclear, built for each dialect of the platform
[home.dialects]
title = "Change the dialect, keep the code"
text = "The controller of the example API, built for FastAPI and for NestJS. The .nuc file is the same."
platform = "backend"

[home.platforms]
title = "Synapsis: one framework, three platforms"
text = "The same architecture, the same words and errors as values on a phone, a server and a browser. Pick one: each page goes from the idea to the code, level by level."

[home.tools]
title = "Everything around the language"
text = "A command, generators, an MCP server for any AI client, editors, a private knowledge base and local agents. Each one has its page."

[home.libraries]
title = "Any library of the target"
text = "This site animates with the npm package motion: nuclear add motion installed it, wrote it in config.nuc and generated its type definitions, so the Nuclear code calls it checked, like its own."
code = '''
nuclear add motion
'''
example = '''
// Fades in every block with the class "reveal" when it scrolls into view.
stateful Reveal(child: Element)
  initState() void
    inView(".reveal", (element) => fadeIn(element))

  fadeIn(element: any) void
    animate(element, { "opacity": [0, 1], "transform": ["translateY(24px)", "none"] }, { "duration": 0.6 })
'''

[home.install]
title = "Install"
# {{site}}: the site's url
lines = [
  "curl -fsSL {{site}}/install.sh | sh                 # Linux and macOS",
  "irm {{site}}/install.ps1 | iex                      # Windows (PowerShell)",
  "nuclear new my_api -p backend                       # a project of a platform: mobile, backend or web",
  "nuclear help                                        # documentation topics, also offline",
]

# --- the tools: the index (/tools) and one page each (/tools/<key>). `pages` are the tool's documents in the tree ---

[[tools]]
key = "cli"
name = "The nuclear command"
group = "Build"
tagline = "One binary for the compiler and the framework."
pitch = "nuclear builds, checks, fixes and formats .nuc files, and creates, generates, runs, tests and migrates the projects of the three platforms. It knows no target language: what it runs for a platform comes from the dialect."
highlights = [
  { title = "Compiler commands", text = "build, check --json, fix, fmt, spec --brief, defs show: everything an editor or an agent needs, offline." },
  { title = "Project commands", text = "new, make, gen, run, test, install, migrate, add: the same words for mobile, backend and web." },
  { title = "Documentation inside", text = "nuclear help <topic> prints the guide and the references, also without network." },
]
demo = '''
nuclear new shop -p backend          # a project: only .nuc files
nuclear gen resource orders Order --fields "id:int total:double"
nuclear check --json                 # every error, with its exact fix
nuclear build && nuclear test
'''
project = "tools/cli"
pages = ["tools/cli/docs/08-guides/README", "tools/cli/docs/08-guides/commands", "nuclearlang/docs/08-guides/README"]

[[tools]]
key = "generator"
name = "Code generator"
group = "Build"
tagline = "The standard code is written by a tool, not by a model."
pitch = "nuclear gen writes a finished resource from its fields, an example answer of an API or a spec: models, repository, a use case per action, the facade, the controller or the screen, and the tests. nuclear make writes one piece of any kind in its right folder. A generator never overwrites a file."
highlights = [
  { title = "From what you have", text = "--fields, --from-json <url|file> or --from-spec <spec.md>; nested objects become models." },
  { title = "For every platform", text = "A database resource on a backend, an HTTP one on a phone or in a browser, with its screen." },
  { title = "Safe to run twice", text = "A file that exists is kept; only the members a facade lacks are added." },
]
demo = '''
nuclear gen resource characters Character --from-json https://rickandmortyapi.com/api/character
nuclear gen usecase orders CancelOrder --route "POST orders/{id}/cancel"
nuclear make stateful home Counter
'''
project = "tools/code_generator"
pages = ["tools/code_generator/docs/08-guides/README", "nuclear-synapsis-framework/docs/08-guides/generators"]

[[tools]]
key = "mcp"
name = "MCP server"
group = "AI"
tagline = "NuclearLang inside Claude Code, Codex, Cursor and OpenCode."
pitch = "nuclear-mcp speaks the Model Context Protocol. It gives a frontier model the generators that write the standard code, the local developer that writes what is left, the Smart Graph to look things up instead of guessing, and the compiler to check everything. Its instructions make every client work the same way."
highlights = [
  { title = "Generate first", text = "generate_resource and generate_usecase are the generators, as tools." },
  { title = "Validate always", text = "nuclear_check and the project's tests decide when a change is done." },
  { title = "Local or remote", text = "With the local services it delegates to the small agents; without them the model writes what is left." },
]
demo = '''
claude mcp add --scope user nuclear -- nuclear-mcp
nuclear-mcp tools          # its instructions and every tool, as JSON
'''
project = "tools/mcp"
pages = ["tools/mcp/docs/08-guides/mcp", "installer/docs/08-guides/ai-setup"]

[[tools]]
key = "extensions"
name = "Editor extensions"
group = "Edit"
tagline = "VS Code, Android Studio / IntelliJ and Zed."
pitch = "The language server gives every editor the compiler's diagnostics with their fixes, completion from the type definitions, hover, go to definition and semantic colors. VS Code adds the Nuclear workspace: one strip with the project's actions and the tools (Connector, Devices, Builder, the agent, settings), tasks, debugging in .nuc and hot reload."
highlights = [
  { title = "The compiler as you type", text = "Every error underlined with its quick fix, the same ones nuclear fix applies." },
  { title = "The Nuclear workspace", text = "Run, debug, test and build any platform from one strip; each tool one key away (Ctrl+Alt+H, V, P, A, S)." },
  { title = "Chernobyl themes", text = "Vivid, radioactive colors for Nuclear, the same in the three editors and on this site." },
]
demo = '''
nuclear code               # open the project in VS Code with its tasks and devices
'''
project = "extensions"
pages = ["extensions/docs/08-guides/README", "extensions/vscode/docs/08-guides/README", "extensions/vscode/docs/08-guides/workspace", "extensions/vscode/docs/08-guides/run-and-debug", "extensions/jetbrains/docs/08-guides/README", "extensions/zed/docs/08-guides/README"]

[[tools]]
key = "builder"
name = "Nuclear Builder"
group = "AI"
tagline = "From a spec to a feature, stage by stage."
pitch = "The Builder runs a spec through a pipeline of agents: it plans, writes the tests first, generates and writes the code, runs the checks and the tests, reviews security and keeps a journal of everything. You follow each run in the editor or from the terminal."
highlights = [
  { title = "Spec in, feature out", text = "A Markdown spec with its acceptance criteria starts a run." },
  { title = "Every stage visible", text = "Each step, its files and its result, in the editor's panel." },
  { title = "The tools first", text = "What a generator can write, no model writes." },
]
demo = '''
nuclear-builder run spec.md
'''
