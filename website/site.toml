# The site's data: what tools/content.mjs turns into public/content/*.json and the app shows. The pages themselves
# are the .md of the projects of the tree (their docs/07-reference and docs/08-guides); nothing of the site is
# written in its code. Every number the site shows is measured when it is built (the onboarding runs the real
# commands), never written here.

[site]
title = "NuclearLang"
lead = "Write only the logic."
tagline = "An ecosystem made for AI agents and easy for people to read. Nuclear drops every line that is not business logic, so an agent writes less, guesses less and is checked on every name. One codebase becomes TypeScript, Dart and Python; Synapsis builds mobile apps, backends and web apps from it."
# where the site is published, the organization of its repositories and their branch
url = "https://nuclearlang.github.io"
org = "https://github.com/nuclearlang"
branch = "main"
footer = "NuclearLang and Synapsis · free and open source, Apache-2.0 · this site is written in Nuclear (Synapsis web)"

# the logos of the integrations (simple-icons, CC0): name → its slug. Shown next to a name, never inside a text.
[logos]
typescript = "typescript"
dart = "dart"
python = "python"
flutter = "flutter"
fastapi = "fastapi"
nestjs = "nestjs"
react = "react"
claude = "claude"
cursor = "cursor"
jetbrains = "jetbrains"
androidstudio = "androidstudio"
zed = { simple = "zedindustries", name = "Zed" }
ollama = "ollama"
langchain = "langchain"
claudecode = "claudecode"
opencode = "opencode"
codex = { lucide = "square-terminal", name = "Codex" }
vscode = { devicon = "vscode/vscode-original", name = "VS Code" }
intellij = { devicon = "intellij/intellij-original", name = "IntelliJ IDEA" }
linux = "linux"
apple = { simple = "apple", name = "macOS" }
windows = { devicon = "windows11/windows11-original", name = "Windows" }

