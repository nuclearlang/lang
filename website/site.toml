  { title = "Colored by method", text = "GET, POST, PUT, PATCH and DELETE, each with its color of the theme." },
  { title = "Inside the workspace", text = "Ctrl+Alt+H opens it next to the code." },
]
demo = '''
Ctrl+Alt+H                 # VS Code: the Connector of the open project
'''
