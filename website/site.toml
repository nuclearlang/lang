# --- the platforms: one page each (/platforms/<key>, its levels from the hook to the code) and an onboarding
# (/start/<key>): the commands that make its example app, run again when the site is built ---

[[platforms]]
key = "mobile"
name = "Mobile"
dialects = ["flutter"]
tagline = "Apps for Android, iOS, desktop and the web, from .nuc."
pitch = "Screens, state managers, forms, a local database, events, sessions and Genkit AI, written as the business logic only. The dialect writes a complete Flutter app on the Synapsis runtime."
pages = ["nuclear-synapsis-framework/platforms/mobile/docs/08-guides/onboarding-mobile", "nuclear-synapsis-framework/platforms/mobile/docs/07-reference/mobile", "nuclearlang/dialects/dart/docs/07-reference/flutter", "nuclear-synapsis-framework/platforms/mobile/docs/08-guides/genkit"]

[[platforms.levels]]
level = "1 · Context"
title = "Your app, its users and what it talks to"
text = "People use the app on a phone, a tablet, a desktop or a browser. The app reads APIs (a Synapsis backend or any other), keeps data on the device and can call AI models through Genkit."
boxes = [
  { name = "User", kind = "person", text = "uses the app" },
  { name = "Your app", kind = "system", text = "written in Nuclear" },
  { name = "APIs", kind = "external", text = "a Synapsis backend or any REST API" },
  { name = "AI models", kind = "external", text = "through Genkit" },
]
flows = ["User → Your app: taps, reads, types", "Your app → APIs: HTTP with cache and retries", "Your app → AI models: chats, flows, RAG"]

[[platforms.levels]]
level = "2 · Containers"
title = "From .nuc to a running app"
text = "You write the project in Nuclear. nuclear transpiles it with the flutter dialect into build/app, a complete Flutter app on the synapsis runtime package. You never edit build/."
boxes = [
  { name = "Nuclear project", kind = "container", text = "config.nuc, main.nuc, components/, test/" },
  { name = "nuclear + dialect", kind = "container", text = "the transpiler and the flutter dialect (TOML and templates)" },
  { name = "build/app", kind = "container", text = "the generated Flutter app" },
  { name = "synapsis runtime", kind = "container", text = "the Dart package the app runs on" },
]
flows = ["Nuclear project → nuclear + dialect: nuclear build", "nuclear + dialect → build/app: Dart code, pubspec, assets", "build/app → synapsis runtime: state, http, events, session"]

[[platforms.levels]]
level = "3 · Components"
title = "Inside a component"
text = "Each feature is a component with three layers. A screen asks its state manager; the manager calls the component's facade; the facade runs a use case; only the use case calls the repository. The compiler enforces it (N0301, N0302)."
boxes = [
  { name = "Screen", kind = "component", text = "@screen: a view and its route" },
  { name = "State manager", kind = "component", text = "emits the states the screen builds" },
  { name = "App component", kind = "component", text = "the component's facade" },
  { name = "Use case", kind = "component", text = "one exec, returns Result" },
  { name = "Repository", kind = "component", text = "@get, @post... over a connection" },
]
flows = ["Screen → State manager", "State manager → App component", "App component → Use case", "Use case → Repository"]

[[platforms]]
key = "backend"
name = "Backend"
dialects = ["fastapi", "nestjs"]
tagline = "APIs in Python or TypeScript, from the same .nuc."
pitch = "Controllers, entities with relations, migrations, pagination, transactions, events, Kafka and Redis, and AI agents and graphs, written once. The fastapi dialect writes Python, the nestjs dialect TypeScript; the Nuclear does not change."
pages = ["nuclear-synapsis-framework/platforms/backend/docs/08-guides/onboarding-backend", "nuclear-synapsis-framework/platforms/backend/docs/07-reference/backend", "nuclearlang/dialects/python/docs/07-reference/fastapi", "nuclearlang/dialects/typescript/docs/07-reference/nestjs", "nuclear-synapsis-framework/platforms/backend/docs/08-guides/contracts"]

[[platforms.levels]]
level = "1 · Context"
title = "Your API, its clients and its data"
text = "Apps (mobile, web or any HTTP client) call the API. The API keeps its data in a database and can publish events and run AI agents. It publishes its contract, so a Synapsis client generates its models from it."
boxes = [
  { name = "Client apps", kind = "person", text = "mobile, web or any HTTP client" },
  { name = "Your API", kind = "system", text = "written in Nuclear" },
  { name = "Database", kind = "external", text = "SQLite, PostgreSQL, MySQL, MariaDB" },
  { name = "Brokers and models", kind = "external", text = "Kafka, Redis, OpenAI, Ollama, Chroma" },
]
flows = ["Client apps → Your API: HTTP and JSON", "Your API → Database: entities and migrations", "Your API → Brokers and models: events, agents"]

[[platforms.levels]]
level = "2 · Containers"
title = "One project, two languages"
text = "config.nuc names the dialect. nuclear builds the same project into a FastAPI app (on synapsis-py) or a NestJS app (on synapsis-nest). Only the plugins the project names go to the generated app."
boxes = [
  { name = "Nuclear project", kind = "container", text = "config.nuc, components/, test/" },
  { name = "nuclear + dialect", kind = "container", text = "fastapi or nestjs" },
  { name = "build/", kind = "container", text = "the generated Python or TypeScript app" },
  { name = "runtime", kind = "container", text = "synapsis-py or synapsis-nest" },
]
flows = ["Nuclear project → nuclear + dialect: nuclear build", "nuclear + dialect → build/: the app, its tests, its migrations", "build/ → runtime: database, events, http"]

[[platforms.levels]]
level = "3 · Components"
title = "Inside a component"
text = "A controller exposes the routes; the facade gives it the use cases; a use case uses the repositories and their entities. Errors are values: a Result becomes the right HTTP status."
boxes = [
  { name = "Controller", kind = "component", text = "@controller, @get, @post..." },
  { name = "App component", kind = "component", text = "the component's facade" },
  { name = "Use case", kind = "component", text = "one exec, returns Result" },
  { name = "Repository", kind = "component", text = "queries over the entities" },
  { name = "Entity", kind = "component", text = "@entity: a table" },
]
flows = ["Controller → App component", "App component → Use case", "Use case → Repository", "Repository → Entity"]

[[platforms]]
key = "web"
name = "Web"
dialects = ["react"]
tagline = "The mobile platform, in a browser."
pitch = "The same words as the mobile platform (screens, state managers, repositories, events, guards), so an app's domain reads the same on a phone and on the web. The react dialect writes React without JSX, React Router and Vite. This site is one."
pages = ["nuclear-synapsis-framework/platforms/web/docs/08-guides/onboarding-web", "nuclear-synapsis-framework/platforms/web/docs/07-reference/web", "nuclearlang/dialects/typescript/docs/07-reference/react"]

[[platforms.levels]]
level = "1 · Context"
title = "Your web app, its users and what it talks to"
text = "People open the app in a browser. It reads APIs over HTTP and keeps the session in the browser's storage."
boxes = [
  { name = "User", kind = "person", text = "in a browser" },
  { name = "Your web app", kind = "system", text = "written in Nuclear" },
  { name = "APIs", kind = "external", text = "a Synapsis backend or any REST API" },
]
flows = ["User → Your web app: clicks, reads, types", "Your web app → APIs: HTTP with cache and retries"]

[[platforms.levels]]
level = "2 · Containers"
title = "From .nuc to a page"
text = "nuclear transpiles the project with the react dialect into build/app: TypeScript, React components, the router and a Vite project, on the synapsis-web runtime."
boxes = [
  { name = "Nuclear project", kind = "container", text = "config.nuc, main.nuc, components/, public/" },
  { name = "nuclear + dialect", kind = "container", text = "the react dialect" },
  { name = "build/app", kind = "container", text = "TypeScript, React, Vite" },
  { name = "synapsis-web", kind = "container", text = "views, state, http, router, tests" },
]
flows = ["Nuclear project → nuclear + dialect: nuclear build", "nuclear + dialect → build/app: components and routes", "build/app → synapsis-web: state, http, session"]

[[platforms.levels]]
level = "3 · Components"
title = "Inside a component"
text = "The same layers as on a phone: a screen with its route asks its state manager, the manager calls the facade, a use case calls the repository."
boxes = [
  { name = "Screen", kind = "component", text = "@screen(route)" },
  { name = "State manager", kind = "component", text = "emits the states" },
  { name = "App component", kind = "component", text = "the facade" },
  { name = "Use case", kind = "component", text = "returns Result" },
  { name = "Repository", kind = "component", text = "@get over Http" },
]
flows = ["Screen → State manager", "State manager → App component", "App component → Use case", "Use case → Repository"]

# the onboarding of each platform: the steps that make its example app (`example`, a folder of the tree). The site
# runs every `run` again in a scratch folder when it is built, shows its real output, and fails when the result is
# not the example of the tree (UPDATE_EXAMPLES=1 writes the example from it). `show` is the file of the level
# "4 · Code": its Nuclear and what each dialect writes from it.
[[onboarding]]
platform = "backend"
example = "nuclear-synapsis-framework/platforms/backend/examples/onboarding/todos_api"
show = "components/todos/api/todos_controller.nuc"
steps = [
  { title = "Create the project", text = "A backend project: config.nuc, the app's configuration and a first test. Only .nuc files.", run = "nuclear new todos_api -p backend" },
  { title = "Generate the resource", text = "The entity, its repository, a use case per action, the facade, the controller with its routes and the tests, in one command.", run = "nuclear gen resource todos Todo --fields \"id:int title:string completed:boolean\"" },
  { title = "Check it", text = "Every file, as an agent reads it: an empty list is no error.", run = "nuclear check --json" },
  { title = "Build, install, test, run", text = "The Python app in build/, its virtual environment, the tests, and the server on http://localhost:8000 (its docs at /docs).", command = "nuclear build && nuclear install && nuclear test && nuclear run" },
]

[[onboarding]]
platform = "web"
example = "nuclear-synapsis-framework/platforms/web/examples/onboarding/todos_web"
show = "components/todos/presentation/todos/todos_screen.nuc"
steps = [
  { title = "Create the project", text = "A web project: config.nuc, main.nuc (the router) and the app's configuration.", run = "nuclear new todos_web -p web" },
  { title = "Generate the resource and its screen", text = "The model, an HTTP repository over the API, the use cases, the facade, a screen that lists the todos with its state manager, and a test.", run = "nuclear gen resource todos Todo --source rest:https://jsonplaceholder.typicode.com --path todos --fields \"id:int title:string completed:boolean\" --screen todos" },
  { title = "Check it", text = "Every file, as an agent reads it: an empty list is no error.", run = "nuclear check --json" },
  { title = "Build, install, test, run", text = "The React app in build/app, its packages, the tests, and Vite on http://localhost:5173/todos.", command = "nuclear build && nuclear install && nuclear test && nuclear run" },
]

[[onboarding]]
platform = "mobile"
example = "nuclear-synapsis-framework/platforms/mobile/examples/onboarding/todos_app"
show = "components/todos/presentation/todos/todos_screen.nuc"
steps = [
  { title = "Create the project", text = "A mobile app: config.nuc, main.nuc, a home component and its screen, and the Flutter app in build/app.", run = "nuclear new todos_app -p mobile" },
  { title = "Generate the resource and its screen", text = "The model, an HTTP repository over the API, the use cases, the facade, a screen that lists the todos with its state manager, and a test.", run = "nuclear gen resource todos Todo --source rest:https://jsonplaceholder.typicode.com --path todos --fields \"id:int title:string completed:boolean\" --screen todos" },
  { title = "Check it", text = "Every file, as an agent reads it: an empty list is no error.", run = "nuclear check --json" },
  { title = "Build, test, run", text = "The Flutter app, its tests, and the app on a device: a phone window with nuclear device, or nuclear run.", command = "nuclear build && nuclear test && nuclear device pixel7" },
]
