path = "/nuclear-synapsis-framework/docs/08-guides/README"

[[top]]
title = "Dialects"
path = "/nuclearlang/docs/07-reference/dialects"

# the side menu: pages by their path in the tree, without .md; `*` matches any part of a name, in order
[[sidebar]]
