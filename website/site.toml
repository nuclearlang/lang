tagline = "A private knowledge base every agent reads."
pitch = "The Smart Graph holds what the tree knows (the tools, every error and its fix, the platforms, the documents, the playbooks) as rows an agent can ask. It runs on your machine: agents look things up instead of guessing, and nothing leaves it."
