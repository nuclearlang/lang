# python dialect: how each Nuclear construct is written in Python 3.12+ (PEP 8, PEP 695 generics, typed).
# A "target" dialect: it extends no other, so it defines every [syntax] template. fastapi extends it.
# The generated code passes `pyright --strict`. Format and variables: nuclearlang/docs/07-reference/dialects.md or `nuclear spec`.

[dialect]
name = "python"
description = "Python 3.12+ typed (PEP 8, PEP 695 generics), checked with pyright --strict"
file_extension = "py"
indent = "    "
# type definitions (nuclearlang/docs/07-reference/definitions.md): the standard library; packages of defs/python/<package>/<version>/
defs = ["python@3.14"]

[options]
implicit_self = false            # members are written with self.
named_args = "native"            # f(x = 1) → f(x=1)
declare_ctor_fields = true       # User(name: string) → name: str at class level + self.name = name
init_fields = true               # fields with a default are set in __init__ (no shared mutable defaults)
optional_params_nullable = true  # name?: string → name: str | None = None
snake_case_names = true          # getOne() → get_one(): the .nuc keeps Nuclear's camelCase, Python gets PEP 8 names
doc_inside = true                # a doc comment is the docstring of its function, method or class
hoist_block_lambdas = true       # a lambda with a block becomes a local def: Python lambdas are one expression
interp_prefix = "f"              # "Hi ${name}" → f"Hi {name}"
interp_brace_escape = true       # literal { } inside an f-string are doubled
interp_open = "{"
interp_close = "}"
string_quote = '"'
interp_quote = '"'
dollar_escape = "never"
reserved_escape = "suffix"
max_bases = 0                    # multiple inheritance
catch_var = "error"
map_patterns = false             # no `{"k": v} = m` in an assignment: one line per name
decimal_literals = true          # `price: double = 3` is `3.0`: an int and a float print differently
doc_in_text = true               # a docstring is a text: a `\` of the comment is written `\\`
cascade_statements = true        # p = Paint() + ..color = x → p = Paint(); p.color = x
module_separator = "."           # use langchain_core/tools → from langchain_core.tools import ...
type_args_as_args = true         # inject<Repo>() → inject(Repo): Python passes classes as values
toplevel_gap = 2                 # PEP 8: two blank lines between top-level declarations
line_width = 88                  # black / ruff
omit_null_default = false

[syntax]
# annotations are evaluated lazily (a method can name its own class; Python 3.12 and 3.13 need it)
file_prelude = "from __future__ import annotations"

# --- imports ---
import_names = "from {{module}} import {{names}}"
# imports for the type checker only (kinds with type_imports: two entities that refer to each other)
type_imports = "if TYPE_CHECKING:\n{{imports}}"
import_alias = "import {{module}} as {{alias}}"
import_default = "import {{module}}"
import_file = "import {{path}}"
module_path = "{{path}}"
file_path = "{{path}}"
project_import = "{{package}}.{{path}}"
# an import a project with `lazy_imports` moves into the block that uses it: run when that block runs
local_import = "{{import}}"

# --- declarations ---
export = ""
class = """
{{decorators}}class {{name}}{{generics}}{{#extends}}({{extends}}{{#implements}}, {{implements}}{{/implements}}){{/extends}}{{^extends}}{{#implements}}({{implements}}){{/implements}}{{/extends}}:
    {{#doc}}{{doc}}

    {{/doc}}{{#members}}{{members}}{{/members}}{{^members}}{{^doc}}pass{{/doc}}{{/members}}"""
interface = """
{{decorators}}class {{name}}{{generics}}(Protocol{{#extends}}, {{extends}}{{/extends}}):
    {{#members}}{{members}}{{/members}}{{^members}}...{{/members}}"""
interface_field = "{{name}}: {{type}}{{#optional}} | None{{/optional}}"
interface_method = "{{#async}}async {{/async}}def {{name}}{{generics}}(self{{#params}}, {{params}}{{/params}}) -> {{#ret}}{{ret}}{{/ret}}{{^ret}}None{{/ret}}: ..."
enum = """
class {{name}}(Enum):
    {{#items_list}}
    {{.}}
    {{/items_list}}"""
enum_item = "{{name}} = {{#value}}{{value}}{{/value}}{{^value}}auto(){{/value}}"
function = """
{{decorators}}{{public_names}}{{#async}}async {{/async}}def {{name}}{{generics}}({{params}}){{#ret}} -> {{ret}}{{/ret}}:
    {{#doc}}{{doc}}
    {{/doc}}{{body}}"""
method = """
{{decorators}}{{#mods.static}}@staticmethod
{{/mods.static}}{{#mods.get}}@property
{{/mods.get}}{{#mods.set}}@{{name}}.setter
{{/mods.set}}{{#override}}@override
{{/override}}{{public_names}}{{#async}}async {{/async}}def {{name}}{{generics}}({{^mods.static}}self{{#params}}, {{/params}}{{/mods.static}}{{params}}){{#ret}} -> {{ret}}{{/ret}}{{^ret}}{{#mods.set}} -> None{{/mods.set}}{{/ret}}:
    {{#doc}}{{doc}}
    {{/doc}}{{body}}"""
method_signature = """
{{decorators}}{{#mods.static}}@staticmethod
{{/mods.static}}{{#mods.get}}@property
{{/mods.get}}{{#override}}@override
{{/override}}{{#async}}async {{/async}}def {{name}}{{generics}}({{^mods.static}}self{{#params}}, {{/params}}{{/mods.static}}{{params}}) -> {{#ret}}{{ret}}{{/ret}}{{^ret}}None{{/ret}}: ..."""
# a static field is the class's own (`ClassVar`), with its value; the others are set by `__init__` (init_fields)
field = "{{decorators}}{{name}}: {{#static}}ClassVar[{{/static}}{{#type}}{{type}}{{#optional}} | None{{/optional}}{{/type}}{{^type}}Any{{/type}}{{#static}}]{{/static}}{{^in_init}}{{#default}} = {{default}}{{/default}}{{^default}}{{#optional}} = None{{/optional}}{{/default}}{{/in_init}}"
constructor = """
def __init__(self{{#params}}, {{params}}{{/params}}) -> None:
    {{#body}}{{body}}{{/body}}{{^body}}pass{{/body}}"""
field_init = "self.{{name}} = {{value}}"
super_ctor = "super().__init__({{args}})"
ctor_param = "{{name}}{{#type}}: {{type}}{{/type}}{{#default}} = {{default}}{{/default}}{{^default}}{{#optional}} = None{{/optional}}{{/default}}"
# a function that assigns a variable of its file names it first (else Python makes it a local of the function)
global_decl = "global {{names}}"
nonlocal_decl = "nonlocal {{names}}"
# a parameter whose default is a list or a map: None, and the function makes a new one (a default is made once)
default_init = "if {{name}} is None:\n    {{name}} = {{value}}"
param = "{{decorators}}{{name}}{{#type}}: {{type}}{{/type}}{{#default}} = {{default}}{{/default}}{{^default}}{{#optional}} = None{{/optional}}{{/default}}"
params_named_group = "*, {{params}}"
decorator = "@{{name}}{{#has_args}}({{args}}){{/has_args}}"
generics = "[{{names}}]"
generic_param = "{{name}}{{#bound}}: {{bound}}{{/bound}}"
local_function = """
{{#async}}async {{/async}}def {{name}}({{params}}):
    {{body}}"""
main = """
def main() -> None:
    {{body}}"""
comment = "# {{text}}"
doc_comment = { file = "templates/doc_comment.tpl" }

# --- statements ---
const_decl = "{{name}}{{#type}}: {{type}}{{/type}} = {{value}}"
let_decl = "{{name}}{{#type}}: {{type}}{{/type}} = {{value}}"
declare = "{{name}}: {{#type}}{{type}}{{/type}}{{^type}}Any{{/type}}"
assign = "{{target}} {{op}} {{value}}"
expr_stmt = "{{expr}}"
return = "return{{#value}} {{value}}{{/value}}"
if = """
if {{cond}}:
    {{body}}"""
else_if = """

elif {{cond}}:
    {{body}}"""
else = """

else:
    {{body}}"""
for_in = """
for {{var}} in {{iter}}:
    {{body}}"""
for_range = """
for {{var}} in range({{start}}, {{end}}):
    {{body}}"""
for_entries = """
for {{key}}, {{value}} in {{iter_member}}.items():
    {{body}}"""
while = """
while {{cond}}:
    {{body}}"""
try = """
try:
    {{body}}{{#catch}}
except Exception{{#catch_used}} as {{catch_var}}{{/catch_used}}:
    {{catch_body}}{{/catch}}{{#finally}}
finally:
    {{finally_body}}{{/finally}}"""
throw = "raise {{value}}"
break = "break"
continue = "continue"
yield = "yield {{value}}"
yield_all = "yield from {{value}}"

# --- expressions ---
self_member = "self.{{name}}"
this = "self"
super = "super()"
null = "None"
true = "True"
false = "False"
list = "[{{items}}]"
object = "{{{entries}}}"
object_entry = "{{key}}: {{value}}"
object_key_ident = "\"{{key}}\""
object_key_string = "\"{{key}}\""
object_shorthand = "\"{{key}}\": {{key}}"
object_spread = "**{{expr}}"
call = "{{callee}}({{args}})"
construct = "{{callee}}({{args}})"
named_arg = "{{name}}={{value}}"
spread_arg = "*{{expr}}"
list_if = "*([{{value}}] if {{cond}} else [])"
cascade = "{{target}}"
cascade_self = ""
pattern_ignore = "_"
pattern_assign = "{{target}} = {{value}}"
member = "{{object}}.{{name}}"
# a parameter renamed because it would hide a function of Python (`list` → `list_`) keeps its own name for whoever reads
# the signature or passes it by name: FastAPI, an MCP or LangChain tool, a keyword call
renamed_params = { template = "@_public_names({{#renamed}}{{local}}=\"{{name}}\"{{^@last}}, {{/@last}}{{/renamed}})\n", helper = "def _public_names[_F: Callable[..., Any]](**_names: str) -> Callable[[_F], _F]:\n    \"\"\"Shows the parameters renamed for Python (`list_`) by their own names (`list`) to whoever reads the signature\n    or passes them by name (a route, an MCP or LangChain tool, a keyword call).\"\"\"\n    import inspect as _inspect\n\n    def _wrap(_fn: _F) -> _F:\n        _back = {_public: _local for _local, _public in _names.items()}\n\n        def _locals(_kwargs: dict[str, Any]) -> dict[str, Any]:\n            return {_back.get(_k, _k): _v for _k, _v in _kwargs.items()}\n\n        @functools.wraps(_fn)\n        async def _call_async(*_args: Any, **_kwargs: Any) -> Any:\n            return await _fn(*_args, **_locals(_kwargs))\n\n        @functools.wraps(_fn)\n        def _call(*_args: Any, **_kwargs: Any) -> Any:\n            return _fn(*_args, **_locals(_kwargs))\n\n        _out = _call_async if _inspect.iscoroutinefunction(_fn) else _call\n        _sig = _inspect.signature(_fn)\n        _params = [_p.replace(name=_names.get(_p.name, _p.name)) for _p in _sig.parameters.values()]\n        setattr(_out, \"__signature__\", _sig.replace(parameters=_params))\n        _out.__annotations__ = {_names.get(_k, _k): _v for _k, _v in _fn.__annotations__.items()}\n        return cast(_F, _out)\n\n    return _wrap" }
# in an interpolated text a missing value is `null` and a boolean `true` / `false`, as Nuclear writes them (print
# does it through `_print`)
show_nullable = { template = "_text({{expr}})", helper = "def _text(v: object) -> str:\n    if v is True:\n        return \"true\"\n    if v is False:\n        return \"false\"\n    if v is None:\n        return \"null\"\n    return str(v)" }
show_bool = { template = "_text({{expr}})", helper = "def _text(v: object) -> str:\n    if v is True:\n        return \"true\"\n    if v is False:\n        return \"false\"\n    if v is None:\n        return \"null\"\n    return str(v)" }
show_any = { template = "_text({{expr}})", helper = "def _text(v: object) -> str:\n    if v is True:\n        return \"true\"\n    if v is False:\n        return \"false\"\n    if v is None:\n        return \"null\"\n    return str(v)" }
optional_member = "({{object}}.{{name}} if {{object}} is not None else None)"
# the object is a call: made once
optional_member_once = { template = "_opt({{object}}, lambda v: v.{{name}})", helper = "def _opt[T, R](value: T | None, read: Callable[[T], R]) -> R | None:\n    return None if value is None else read(value)" }
# a chain after a `?.` (`u?.name.upper()`): all of it waits for each receiver, as `?.` does in TypeScript and Dart
optional_chain = "({{value}} if {{conds}} else None)"
optional_cond = "{{object}} is not None"
# a map read is None when the key is absent (nuclearlang/docs/07-reference/library.md §3); a list index stays an index
index = "{{#map}}{{object}}.get({{index}}){{/map}}{{^map}}{{object}}[{{index}}]{{/map}}"
# a map whose values are never null: the expert's forms, with no helper call in a loop
map_sure = "{{object}}[{{index}}]"
map_get_or = "{{object}}.get({{index}}, {{default}})"
await = "await {{expr}}"
ternary = "{{then}} if {{cond}} else {{else}}"
# `x is int` must not accept booleans (bool is a subclass of int in Python)
is = "{{#t.map}}isinstance({{expr}}, dict){{/t.map}}{{^t.map}}{{#t.list}}isinstance({{expr}}, list){{/t.list}}{{^t.list}}{{#t.is.int}}type({{expr}}) is int{{/t.is.int}}{{^t.is.int}}isinstance({{expr}}, {{type}}){{/t.is.int}}{{/t.list}}{{/t.map}}"
cast = "cast({{type}}, {{expr}})"
non_null = { template = "_sure({{expr}})", helper = "def _sure[T](x: T | None) -> T:\n    assert x is not None\n    return x" }   # pyright: the value is not None
# never written: options.hoist_block_lambdas turns a lambda with a block into a local_function
lambda = "lambda {{names}}: {{body}}"
# a name of the loop around a lambda, bound when the lambda is made: Python binds a closure late (in a loop every
# lambda would see the last turn; TypeScript and Dart give each turn its own binding)
bound_param = "{{name}}{{#type}}: {{type}} = {{/type}}{{^type}}={{/type}}{{name}}"
lambda_expr = "lambda{{#names}} {{names}}{{/names}}: {{expr}}"

# --- the monitor (`--monitor`, spec 015): a context variable follows the call, sync or async ---
monitor_body = """
nuclear_span = NuclearMonitor.enter("{{label}}", "{{path}}", {{line}}, {{#async}}True{{/async}}{{^async}}False{{/async}})
try:
    {{body}}
finally:
    NuclearMonitor.exit(nuclear_span)"""
monitor_runtime = { file = "templates/monitor.tpl" }

# --- Result<E, T> (nuclearlang/docs/07-reference/nuclear-base.md §3.2): templates/result.tpl, the dialect's own runtime ---
result_runtime = { file = "templates/result.tpl" }
result_ok = "Ok({{#value}}{{value}}{{/value}}{{^value}}None{{/value}})"
result_err = "Err({{value}})"
result_is_ok = "{{result}}.is_ok"
result_is_err = "{{result}}.is_err"
result_value = "{{result}}.value"
result_error = "{{result}}.error"
result_propagate = """
if {{result}}.is_err:
    return Err({{result}}.error)"""
result_then = "{{target}}.and_then({{callback}})"
result_tap = "{{target}}.inspect({{callback}})"
result_recover = "{{target}}.or_else({{callback}})"
result_tap_error = "{{target}}.inspect_err({{callback}})"
result_map = "{{target}}.map({{callback}})"
result_get_or_else = "{{target}}.get_or_else({{callback}})"

[types]
Result = "Result"
Error = "Exception"
string = "str"
int = "int"
double = "float"
number = "float"
boolean = "bool"
bool = "bool"
void = "None"
any = "Any"
dynamic = "Any"
unknown = "object"
list = "list[{{item}}]"
map = "dict[{{key}}, {{value}}]"
nullable = "{{type}} | None"
union = "{{types|join:\" | \"}}"
string_literal = "Literal[{{value}}]"
number_literal = "Literal[{{value}}]"
function = "Callable[[{{types}}], {{ret}}]"
generic = "{{name}}[{{args}}]"
async = "{{type}}"
Future = "Awaitable"
DateTime = "datetime.datetime"
Duration = "datetime.timedelta"
Bytes = "bytes"
Regex = "re.Pattern[str]"
Match = "re.Match[str]"
Set = "set"
generator = "Iterator[{{type}}]"
async_generator = "AsyncIterator[{{type}}]"

[operators]
and = "and"
or = "or"
not = "not "
neg = "-"
# with null: `x is None` (PEP 8)
eq = "{{left_infix}} {{#null}}is{{/null}}{{^null}}=={{/null}} {{right_infix}}"
not_eq = "{{left_infix}} {{#null}}is not{{/null}}{{^null}}!={{/null}} {{right_infix}}"
lt = "<"
gt = ">"
lt_eq = "<="
gt_eq = ">="
add = "+"
sub = "-"
mul = "*"
div = "/"
rem = "%"
coalesce = "{{left}} if {{left}} is not None else {{right}}"
# a call or a map read on the left is evaluated once (and pyright narrows the value); the right side stays lazy
coalesce_once = { template = "_coalesce({{left_arg}}, lambda: {{right_arg}})", helper = "def _coalesce[T](value: T | None, fallback: Callable[[], T]) -> T:\n    return value if value is not None else fallback()" }
# `~/` drops the decimals toward zero, as in TypeScript and Dart (Python's `//` floors: -7 // 2 is -4); exact on big ints
int_div = { template = "_idiv({{left_arg}}, {{right_arg}})", helper = "def _idiv(a: int | float, b: int | float) -> int:\n    if isinstance(a, int) and isinstance(b, int):\n        q = a // b\n        return q + 1 if q < 0 and q * b != a else q\n    return int(a / b)" }
pow = "**"
bit_and = "&"
bit_or = "|"
bit_xor = "^"
bit_not = "~"
shl = "<<"
shr = ">>"
# Python ints have no width: >>> works as on a 32-bit value, like TypeScript
ushr = "({{left}} % 0x100000000) >> {{right}}"
in = "{{left}} in {{right}}"
range = "range({{left}}, {{right}})"

[names]
# names the templates write: imported from typing / enum when the generated code uses them
written = ["Any", "ClassVar", "Protocol", "Callable", "Literal", "Iterator", "AsyncIterator", "Awaitable", "cast", "override", "Enum", "auto", "math", "json", "re", "base64", "datetime", "functools", "random", "asyncio"]

[auto_imports]
"typing" = ["TYPE_CHECKING", "Any", "Protocol", "Callable", "Literal", "Iterator", "AsyncIterator", "Awaitable", "cast", "override", "Never", "TypedDict", "Annotated", "ClassVar", "Final", "Self"]
# modules the library templates write, imported as themselves (import math)
"math" = ["math"]
"json" = ["json"]
"re" = ["re"]
"base64" = ["base64"]
"datetime" = ["datetime"]
"functools" = ["functools"]
"random" = ["random"]
"asyncio" = ["asyncio"]
"enum" = ["Enum", "auto", "StrEnum", "IntEnum"]
"dataclasses" = ["dataclass", "field"]

[modifiers]
abstract = ""
static = ""
get = ""
set = { prefix = "", void = true }   # a setter never returns

# projects (nuclearlang/docs/07-reference/projects.md): the .nuc files go to the package app (from app.models.user import User), or to the
# one nuclear.toml names ([project] package = "my_lib": from my_lib.models.user import User)
[project]
sources = "app"

[imports]
asyncio = "asyncio"
json = "json"
math = "math"
re = "re"
os = "os"

[functions]
# print(a, b) writes the values separated by spaces, with Nuclear's text for booleans and null (nuclearlang/docs/07-reference/library.md §12)
# (its named arguments are Python's own: `print(line, flush = true)`, `print(e, file = sys.stderr)`)
print = { template = "_print({{call_args}})", helper = "def _show(v: object) -> str:\n    if v is True:\n        return \"true\"\n    if v is False:\n        return \"false\"\n    if v is None:\n        return \"null\"\n    return str(v)\n\n\ndef _print(*args: object, **options: Any) -> None:\n    print(*(_show(a) for a in args), **options)" }
# the standard library (nuclearlang/docs/07-reference/library.md §10)
delay = { template = "asyncio.sleep({{arg0}} / 1000)" }
awaitAll = { template = "asyncio.gather(*{{arg0}})" }
