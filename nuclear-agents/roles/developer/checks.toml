# The checks the Developer proposes (nuclear-agents/roles/README.md). `by = "role"`: the role runs it; `by = "user"`:
# the user runs it and marks it done or failed. A `command` is a key of the `commands` of `.nuclear/builder.json`.

[[check]]
id = "developer.tests-fail-first"
title = "Each new test fails before the code, for the right reason"
title_es = "Cada test nuevo falla antes del código, por la razón correcta"
station = "tests"
on = true
by = "role"
# it runs the project (its commands, its build): in the project, after the station's other checks, alone
parallel = false
# the project compiles and its new tests fail because the code they need is absent: at this station red is the
# expected result, so `nuclear test` is read by the role, never run as a pass/fail command (the green of
# `nuclear test` is developer.tests-pass, at the code station).
prompt = "Run `nuclear check . --json` (it must print `[]`, so the tests compile) and `nuclear test`; read the failures and answer, for each new test of specs/{{id}}/plan.md, whether it fails because the code it needs is missing or wrong (a route that answers 404 where the criterion says 422/400, a skeleton's `Ok(\"\")` where the rule is missing), never because it does not compile. The green of `nuclear test` belongs to developer.tests-pass, at the code station."

[[check]]
id = "developer.compiles"
title = "The compiler reports no error"
title_es = "El compilador no informa ningún error"
station = "code"
on = true
by = "role"
command = "check"

[[check]]
id = "developer.builds"
title = "The project builds"
title_es = "El proyecto compila"
station = "code"
on = true
by = "role"
command = "build"

[[check]]
id = "developer.tests-pass"
title = "Every test passes, old and new, and none was deleted or weakened"
title_es = "Todos los tests pasan, viejos y nuevos, y ninguno se borró ni se debilitó"
station = "code"
on = true
by = "role"
command = "test"

[[check]]
id = "developer.faithful"
title = "Every name, path and value of the plan and the criteria is in the code as written"
title_es = "Cada nombre, ruta y valor del plan y de los criterios está en el código tal como se escribió"
station = "code"
on = true
by = "role"
prompt = "Read specs/{{id}}/plan.md and the acceptance criteria; list every name, path, status or value they write that the code does not have exactly as written, and fix each one. When the plan is what is wrong (what it names does not compile, or the platform has no such name or path: the compiler or nuclear help says so) and the code does what the plan meant, correct plan.md to what the code does and say why in its piece: a plan corrected by the facts is no failure. A value of an acceptance criterion is never changed here: one the code cannot have fails the check."
