# The MCP server is written in Nuclear (the `.nuc` files of this folder, `nuclear.toml`): this file only packages
# what `nuclear build .` writes in `build/nuclear_mcp`. Build before installing or testing.
[project]
name = "nuclear-mcp"
version = "0.101.0"
description = "The MCP server of NuclearLang: the generators, the compiler, the command line, the Smart Graph, the local developer and the internet, for any AI client."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "mcp>=2.3", "nuclear-graph"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nuclear-mcp = "nuclear_mcp.cli:main"

# the graph's package, from the folder beside it (in the working tree and in an installation's ai/)
[tool.uv.sources]
nuclear-graph = { path = "../../nuclear-graph-storage", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["build/nuclear_mcp/**/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["build/nuclear_mcp"]
exclude = ["build/nuclear_mcp/tests"]

[tool.pytest.ini_options]
pythonpath = ["build"]
testpaths = ["build/nuclear_mcp/tests"]
