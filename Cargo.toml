[workspace]
resolver = "3"
# One workspace for every Rust crate of the tree. The Zed extension (wasm) and the spec checker build on their own.
members = ["nuclearlang/crates/*", "tools/cli", "tools/code_generator", "device-emulators"]
exclude = ["extensions/zed", "nuclearlang/tools/spec-check"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
authors = ["Julian Molina"]
repository = "https://github.com/nuclearlang/lang"
homepage = "https://nuclearlang.github.io"

[workspace.dependencies]
nuclear-diag = { path = "nuclearlang/crates/nuclear-diag" }
nuclear-syntax = { path = "nuclearlang/crates/nuclear-syntax" }
nuclear-dialect = { path = "nuclearlang/crates/nuclear-dialect" }
nuclear-transpile = { path = "nuclearlang/crates/nuclear-transpile" }
nuclear-codegen = { path = "tools/code_generator" }
nuclear-devices = { path = "device-emulators" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
