<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><rect width="120" height="120" rx="18" fill="#0b0f0b"/><style>.o{transform-origin:60px 60px;animation:o 2s linear infinite}.o2{animation-duration:3s;animation-direction:reverse}.c{transform-origin:60px 60px;animation:c .6s ease-in-out infinite alternate}@keyframes o{to{transform:rotate(360deg)}}@keyframes c{from{transform:scale(.85)}to{transform:scale(1.15)}}</style><g class="o"><ellipse cx="60" cy="60" rx="44" ry="16" fill="none" stroke="#a7ff00" stroke-width="4"/><circle cx="104" cy="60" r="5" fill="#2fe0f0"/></g><g class="o o2"><ellipse cx="60" cy="60" rx="44" ry="16" fill="none" stroke="#64ff00" stroke-width="4" transform="rotate(60 60 60)"/></g><g class="o" style="animation-duration:2.5s"><ellipse cx="60" cy="60" rx="44" ry="16" fill="none" stroke="#2fe0f0" stroke-width="4" transform="rotate(-60 60 60)"/></g><circle class="c" cx="60" cy="60" r="11" fill="#a7ff00"/></svg>
