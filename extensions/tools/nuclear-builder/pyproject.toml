# Nuclear Builder's set-up and command are written in Nuclear (the `.nuc` files of this folder, `nuclear.toml`): this
# file only packages what `nuclear build .` writes in `build/nuclear_builder`. Build before installing or testing.
[project]
name = "nuclear-builder"
version = "0.101.0"
description = "Nuclear Builder: the set-up of the AI services of NuclearLang and the nuclear-builder command."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "mcp>=2.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nuclear-builder = "nuclear_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `build/` is not kept in git (it is generated), but it is the package: without this the wheel would be empty
[tool.hatch.build]
artifacts = ["build/nuclear_builder/**/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["build/nuclear_builder"]
exclude = ["build/nuclear_builder/tests"]

# the profiles and the requirements travel inside the package (a checkout reads the project's own)
[tool.hatch.build.targets.wheel.force-include]
"setup.json" = "nuclear_builder/setup.json"

[tool.pytest.ini_options]
pythonpath = ["build"]
testpaths = ["build/nuclear_builder/tests"]

[tool.pyright]
typeCheckingMode = "standard"
extraPaths = ["build"]
exclude = [".venv"]
